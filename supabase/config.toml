# Semua fungsi ini memeriksa pemanggilnya sendiri: tablet dengan token perangkat, DOKU dengan
# tanda tangan, dan akun dashboard (admin, doku-setup) dengan token masuknya. Pemeriksaan JWT
# bawaan Supabase dimatikan karena tablet tidak punya akun dan DOKU tidak mengirim JWT.
[functions.qris-create]
verify_jwt = false

[functions.qris-status]
verify_jwt = false

[functions.doku-notify]
verify_jwt = false

[functions.qris-cancel]
verify_jwt = false

[functions.qris-sweep]
verify_jwt = false

[functions.share-upload]
verify_jwt = false

[functions.share-get]
verify_jwt = false

[functions.share-ai]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.doku-setup]
verify_jwt = false
